name: utu-omatapalo-sprint
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRINT_POSTGRES_PASSWORD:?Load the sprint environment first}
      POSTGRES_DB: guidebook
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["sprint-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guidebook"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${SPRINT_STORAGE_ACCESS_KEY:?Load the sprint environment first}
      RUSTFS_SECRET_KEY: ${SPRINT_STORAGE_SECRET_KEY:?Load the sprint environment first}
    command: /data
    ports: ["127.0.0.1:59100:9000", "127.0.0.1:59101:9001"]
    volumes: ["sprint-storage:/data"]
volumes:
  sprint-db:
  sprint-storage:
